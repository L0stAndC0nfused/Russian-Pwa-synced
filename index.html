<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<title>Russian for Jenny</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0a0b;--s1:#111113;--s2:#18181b;--s3:#222226;--border:#2a2a30;
  --gold:#d4a843;--gold2:#f0c866;--red:#e05555;--green:#4ade80;--blue:#60a5fa;--purple:#a78bfa;
  --text:#f4f4f5;--t2:#a1a1aa;--t3:#52525b;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
html{height:100%;overflow:hidden}
body{height:100%;width:100%;overflow:hidden;background:var(--bg);font-family:'Inter',system-ui,sans-serif;
  color:var(--text);position:fixed;inset:0;display:flex;flex-direction:column;
  padding-top:var(--sat);padding-bottom:var(--sab);padding-left:var(--sal);padding-right:var(--sar);
  -webkit-font-smoothing:antialiased}

/* VIEWS */
.view{display:none;flex-direction:column;flex:1;overflow:hidden}
.view.active{display:flex}

/* SUBPAGE */
.subpage{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;
  padding-top:var(--sat);padding-bottom:var(--sab);transform:translateX(100%);
  transition:transform 0.3s cubic-bezier(0.32,0.72,0,1)}
.subpage.open{transform:translateX(0)}
.subpage-header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.subpage-back{width:36px;height:36px;border-radius:50%;background:var(--s2);border:none;color:var(--t2);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s}
.subpage-back:active{transform:scale(0.88)}
.subpage-title{font-size:18px;font-weight:700;letter-spacing:-0.3px}
.subpage-body{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding:16px}

/* CALENDAR */
#view-cal{background:var(--bg)}
.cal-header{padding:14px 20px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cal-month-label{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.cal-month-label span{color:var(--gold)}
.cal-nav{display:flex;gap:4px}
.cal-nav-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--s2);color:var(--t2);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background 0.15s,transform 0.1s}
.cal-nav-btn:active{transform:scale(0.9);background:var(--s3)}
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;flex-shrink:0}
.wd{text-align:center;font-size:11px;font-weight:600;letter-spacing:0.05em;color:var(--t3);padding:6px 0;text-transform:uppercase}
.cal-grid-wrap{flex:1;padding:0 8px 8px;overflow:hidden;display:flex;flex-direction:column}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(6,1fr);flex:1;gap:3px}
.day-cell{border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;position:relative;transition:transform 0.12s cubic-bezier(0.34,1.56,0.64,1),background 0.15s;
  overflow:visible;user-select:none}
.day-cell:active{transform:scale(0.88)}
.day-cell.out-range{opacity:0.15;pointer-events:none}
.day-cell.in-range{background:var(--s1)}
.day-cell.ph0{background:#e0554514}
.day-cell.ph1{background:#d4a84314}
.day-cell.ph2{background:#60a5fa14}
.day-cell.ph3{background:#4ade8014}
.day-cell.ph4{background:#a78bfa14}
.day-cell.ph5{background:#f472b614}
.day-cell.today .day-num{background:var(--gold);color:#000;border-radius:50%;width:28px;height:28px;
  display:flex;align-items:center;justify-content:center;font-weight:700}
.day-cell.selected{outline:2px solid var(--gold);outline-offset:-2px}
/* completion dots */
.cell-done-dot{position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%}
.cell-done-dot.full{background:var(--green)}
.cell-done-dot.partial{background:var(--blue)}
/* word usage dot */
.cell-word-dot{position:absolute;bottom:3px;right:3px;width:6px;height:6px;border-radius:50%}
.cell-word-dot.all{background:var(--green)}
.cell-word-dot.some{background:var(--blue)}
.day-num{font-size:14px;font-weight:500;line-height:1}
.day-dots{display:flex;gap:2px;margin-top:3px;min-height:5px}
.day-dot{width:4px;height:4px;border-radius:50%}
.day-cell.exam-day .day-num{color:var(--red)}

/* TODAY VIEW */
#view-today{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.today-hero{padding:24px 20px 16px;background:linear-gradient(135deg,var(--s1) 0%,var(--bg) 100%)}
.today-date-label{font-size:13px;color:var(--t2);font-weight:500;margin-bottom:4px}
.today-date-big{font-size:32px;font-weight:700;letter-spacing:-1px;margin-bottom:8px}
.today-phase-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;
  font-size:12px;font-weight:600;letter-spacing:0.02em}
.today-note{margin:16px 20px;padding:14px 16px;background:var(--s2);border-radius:12px;font-size:13px;
  color:var(--t2);line-height:1.6;border-left:3px solid var(--gold)}
.today-sec-label{padding:16px 20px 8px;font-size:10px;font-weight:700;letter-spacing:0.12em;
  text-transform:uppercase;color:var(--t3)}
.today-task-card{margin:0 16px 10px;background:var(--s2);border:1px solid var(--border);border-radius:14px;
  padding:14px;transition:transform 0.1s;cursor:pointer;animation:slideUp 0.25s cubic-bezier(0.4,0,0.2,1) both}
.today-task-card:active{transform:scale(0.97)}
.today-task-card.done{opacity:0.45}
.today-task-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.today-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;
  align-items:center;justify-content:center;font-size:11px;flex-shrink:0;
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.today-task-card.done .today-check{background:var(--green);border-color:var(--green);color:#000}
.today-task-name{font-size:14px;font-weight:600}
.today-task-card.done .today-task-name{text-decoration:line-through}
.today-task-desc{font-size:12px;color:var(--t2);line-height:1.5;padding-left:30px}
.today-prog-row{margin:0 16px 20px;padding:14px 16px;background:var(--s2);border-radius:14px;
  border:1px solid var(--border);display:flex;align-items:center;gap:14px}
.today-prog-info{flex:1}
.today-prog-pct{font-size:20px;font-weight:700}
.today-prog-sub{font-size:12px;color:var(--t2)}
.today-prog-track{height:4px;background:var(--s3);border-radius:2px;overflow:hidden;margin-top:8px}
.today-prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}

/* PROGRESS VIEW */
#view-progress{overflow-y:auto;-webkit-overflow-scrolling:touch}
.prog-header{padding:20px 20px 8px;font-size:22px;font-weight:700;letter-spacing:-0.5px}
.prog-ring-wrap{display:flex;justify-content:center;padding:24px 0 16px}
.prog-ring-bg{fill:none;stroke:var(--s2);stroke-width:12}
.prog-ring-fill{fill:none;stroke:url(#ringGrad);stroke-width:12;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:80px 80px;transition:stroke-dashoffset 1s cubic-bezier(0.4,0,0.2,1)}
.prog-ring-text-big{font-size:28px;font-weight:700;fill:var(--text);text-anchor:middle;dominant-baseline:middle}
.prog-ring-text-small{font-size:11px;fill:var(--t2);text-anchor:middle;dominant-baseline:middle;font-family:'Inter',sans-serif}
.prog-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.prog-stat{background:var(--s1);border-radius:14px;padding:16px;border:1px solid var(--border);
  cursor:pointer;transition:transform 0.12s cubic-bezier(0.34,1.56,0.64,1),border-color 0.15s;position:relative}
.prog-stat:active{transform:scale(0.96)}
.prog-stat:hover{border-color:var(--gold)}
.prog-stat-val{font-size:26px;font-weight:700;letter-spacing:-0.5px}
.prog-stat-label{font-size:12px;color:var(--t2);margin-top:2px}
.prog-stat-arrow{position:absolute;top:12px;right:12px;color:var(--t3);font-size:14px}
.phase-progress-list{padding:0 16px 16px}
.phase-prog-item{margin-bottom:14px}
.phase-prog-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.phase-prog-name{font-size:13px;font-weight:500}
.phase-prog-pct{font-size:12px;color:var(--t2);font-weight:600}
.phase-track{height:6px;background:var(--s2);border-radius:3px;overflow:hidden}
.phase-fill{height:100%;border-radius:3px;transition:width 0.8s cubic-bezier(0.4,0,0.2,1)}

/* VOCAB BUILDER */
.vocab-builder-section{padding:0 16px 24px}
.vocab-search{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;
  transition:border-color 0.15s;margin-bottom:12px}
.vocab-search:focus{border-color:var(--gold)}
.vocab-search::placeholder{color:var(--t3)}
.vocab-list-item{background:var(--s2);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  animation:slideUp 0.2s both}
.vocab-list-item.custom{border-color:var(--purple)44}
.vocab-ru-big{font-size:18px;font-weight:600;color:var(--gold);flex:1}
.vocab-en-small{font-size:12px;color:var(--t2);margin-top:2px}
.vocab-audio-btn{width:36px;height:36px;border-radius:50%;background:var(--s3);border:none;
  color:var(--t2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:all 0.15s}
.vocab-audio-btn:active{transform:scale(0.88)}
.vocab-audio-btn.recording{background:var(--red);color:#fff;animation:pulse 1s infinite}
.vocab-audio-btn.has-audio{background:var(--blue)33;color:var(--blue)}
.vocab-del-btn{width:30px;height:30px;border-radius:50%;background:none;border:none;
  color:var(--t3);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.12s}
.vocab-del-btn:active{color:var(--red);background:#e0554520}
.add-vocab-form{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:16px}
.add-vocab-title{font-size:12px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.add-vocab-row{display:flex;gap:8px;margin-bottom:8px}
.add-vocab-input{flex:1;background:var(--s3);border:1.5px solid var(--border);border-radius:8px;
  padding:9px 12px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.15s}
.add-vocab-input:focus{border-color:var(--gold)}
.add-vocab-input::placeholder{color:var(--t3)}
.add-vocab-btn{background:var(--gold);color:#000;border:none;border-radius:8px;padding:9px 16px;
  font-size:12px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;white-space:nowrap;transition:transform 0.1s}
.add-vocab-btn:active{transform:scale(0.93)}

/* BOTTOM NAV */
.bottom-nav{display:flex;background:var(--s1);border-top:1px solid var(--border);flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0 8px;border:none;background:none;cursor:pointer;gap:3px;transition:opacity 0.15s;position:relative}
.nav-btn:active{opacity:0.6}
.nav-icon{font-size:22px;line-height:1;transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.nav-btn.active .nav-icon{transform:scale(1.15)}
.nav-label{font-size:10px;font-weight:600;letter-spacing:0.04em;color:var(--t3);transition:color 0.15s}
.nav-btn.active .nav-label{color:var(--gold)}
.nav-indicator{position:absolute;top:0;width:32px;height:3px;border-radius:0 0 3px 3px;
  background:var(--gold);transform:scaleX(0);transition:transform 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.nav-btn.active .nav-indicator{transform:scaleX(1)}

/* SHEET */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:50;pointer-events:none;transition:background 0.3s}
.backdrop.open{background:rgba(0,0,0,0.65);pointer-events:all}
.sheet{position:fixed;bottom:0;left:0;right:0;z-index:51;background:var(--s1);border-radius:20px 20px 0 0;
  transform:translateY(100%);transition:transform 0.38s cubic-bezier(0.32,0.72,0,1);max-height:92vh;
  display:flex;flex-direction:column;padding-bottom:var(--sab);will-change:transform}
.sheet.open{transform:translateY(0)}
.sheet-handle-wrap{padding:10px 0 4px;display:flex;justify-content:center;flex-shrink:0;cursor:grab}
.sheet-handle{width:40px;height:4px;background:var(--s3);border-radius:2px}
.sheet-head{padding:8px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.sheet-date-num{font-size:36px;font-weight:700;letter-spacing:-1.5px;line-height:1}
.sheet-date-sub{font-size:13px;color:var(--t2);margin-top:2px}
.sheet-phase-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:12px;
  font-size:11px;font-weight:600;margin-top:8px}
.sheet-close{width:32px;height:32px;border-radius:50%;border:none;background:var(--s3);color:var(--t2);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 0.1s}
.sheet-close:active{transform:scale(0.88)}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.sheet-body{padding:16px 20px 24px}

/* SECTION LABELS */
.sec-label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);
  margin:20px 0 10px;display:flex;align-items:center;gap:8px}
.sec-label:first-child{margin-top:0}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}
.day-note{background:var(--s2);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--t2);
  line-height:1.6;border-left:3px solid var(--gold)}

/* VOCAB CARDS IN SHEET */
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vocab-card{background:var(--s2);border:2px solid var(--border);border-radius:10px;padding:10px 12px;
  transition:all 0.15s cubic-bezier(0.34,1.56,0.64,1);cursor:pointer;position:relative;user-select:none}
.vocab-card:active{transform:scale(0.95)}
.vocab-card.used{background:#4ade8018;border-color:var(--green)}
.vocab-ru{font-size:16px;font-weight:600;color:var(--gold);margin-bottom:2px}
.vocab-en{font-size:11px;color:var(--t2)}
.vocab-use-count{position:absolute;top:-6px;left:-6px;background:var(--gold);color:#000;
  border-radius:10px;padding:2px 6px;font-size:10px;font-weight:700;min-width:20px;text-align:center}

/* TASKS */
.task-card{background:var(--s2);border:1px solid var(--border);border-radius:14px;padding:14px;
  margin-bottom:10px;transition:transform 0.12s cubic-bezier(0.34,1.56,0.64,1),border-color 0.2s;
  cursor:pointer;animation:slideUp 0.25s cubic-bezier(0.4,0,0.2,1) both}
.task-card.done{border-color:var(--green);opacity:0.55}
.task-card:active{transform:scale(0.97)}
.task-top{display:flex;align-items:flex-start;gap:12px}
.task-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12px;
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1)}
.task-card.done .task-check{background:var(--green);border-color:var(--green);color:#000}
.task-info{flex:1}
.task-name{font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px}
.task-desc{font-size:12px;color:var(--t2);line-height:1.55}
.task-card.done .task-name{text-decoration:line-through}
.task-footer{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--border)}
.task-dur{font-size:11px;font-weight:600;color:var(--gold);display:flex;align-items:center;gap:4px}
.timer-launch{background:var(--s3);border:none;border-radius:8px;padding:6px 12px;color:var(--t2);
  font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:all 0.15s;font-family:'Inter',sans-serif}
.timer-launch:active{transform:scale(0.93);background:var(--gold);color:#000}

/* EVENTS */
.event-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);animation:slideUp 0.2s both}
.event-item:last-child{border-bottom:none}
.event-bullet{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.event-text{flex:1;font-size:13px}
.event-del{background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;padding:2px 6px;
  border-radius:6px;transition:all 0.12s}
.event-del:active{color:var(--red);background:#e0554520}
.add-event-area{margin-top:10px}
.add-event-row{display:flex;gap:8px;margin-bottom:8px}
.add-event-input{flex:1;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.15s}
.add-event-input:focus{border-color:var(--purple)}
.add-event-input::placeholder{color:var(--t3)}
.add-event-btn{width:44px;height:44px;background:var(--purple);border:none;border-radius:10px;color:#fff;
  font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:transform 0.12s cubic-bezier(0.34,1.56,0.64,1);flex-shrink:0}
.add-event-btn:active{transform:scale(0.88)}
/* 16-colour picker */
.color-picker{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;
  transition:transform 0.15s,border-color 0.15s;flex-shrink:0}
.color-swatch:active{transform:scale(0.85)}
.color-swatch.selected{border-color:#fff}

/* MARK COMPLETE */
.mark-btn{width:100%;padding:14px;border-radius:14px;border:2px solid var(--border);background:none;
  color:var(--t2);font-size:14px;font-weight:600;cursor:pointer;margin-top:20px;font-family:'Inter',sans-serif;
  transition:all 0.2s cubic-bezier(0.34,1.56,0.64,1);display:flex;align-items:center;justify-content:center;gap:8px}
.mark-btn:active{transform:scale(0.97)}
.mark-btn.done-full{border-color:var(--green);color:var(--green);background:#4ade8012}
.mark-btn.done-partial{border-color:var(--blue);color:var(--blue);background:#60a5fa12}

/* TIMER */
.timer-overlay{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:40px 20px;
  padding-top:calc(40px + var(--sat));padding-bottom:calc(40px + var(--sab));
  transform:translateY(100%);transition:transform 0.4s cubic-bezier(0.32,0.72,0,1)}
.timer-overlay.open{transform:translateY(0)}
.timer-task-name{font-size:15px;font-weight:600;color:var(--t2);text-align:center;margin-bottom:40px;max-width:280px}
.timer-ring-wrap{position:relative;width:220px;height:220px;margin-bottom:48px}
.timer-ring-svg{width:220px;height:220px;overflow:visible}
.t-ring-bg{fill:none;stroke:var(--s2);stroke-width:10}
.t-ring-fill{fill:none;stroke:var(--gold);stroke-width:10;stroke-linecap:round;
  transform:rotate(-90deg);transform-origin:110px 110px;transition:stroke-dashoffset 0.5s linear,stroke 0.4s}
.t-ring-fill.warning{stroke:var(--red)}

  showSyncIndicator(true);

  const data = {
    completed: Array.from(completed),
    completedFull: Array.from(completedFull),
    events: events,
    wordUsage: wordUsage,
    customVocab: customVocab,
    vocabAudio: vocabAudio,
    tasks: tasks,
    lastUpdated: Date.now()
  };

  db.ref('progress').set(data).then(() => {
    showSyncIndicator(false);
  }).catch(err => {
    console.error('Save error:', err);
    showSyncIndicator(false);
  });
}

function handleRealtimeUpdate(snapshot) {
  const data = snapshot.val();
  if (!data || !data.lastUpdated) return;

  // Only update if change came from Jenny (not our own change)
  if (Math.abs(Date.now() - data.lastUpdated) > 4000) {
    completed = new Set(data.completed || []);
    completedFull = new Set(data.completedFull || []);
    events = data.events || {};
    wordUsage = data.wordUsage || {};
    customVocab = data.customVocab || [];
    vocabAudio = data.vocabAudio || {};
    tasks = data.tasks || {};

    renderCalendar();
    updateTodayView();
    updateProgress();
    // No sync indicator for background updates
  }
}

function loadData() {
  db.ref('progress').once('value').then(snapshot => {
    const data = snapshot.val() || {};
    const newLastUpdated = data.lastUpdated || Date.now();

    // Get previous timestamp from localStorage (persists across sessions)
    let previousTimestamp = parseInt(localStorage.getItem('lastKnownLastUpdated') || '0');

    console.log("📥 loadData started. Previous:", previousTimestamp, "New:", newLastUpdated);

    const hadPreviousData = previousTimestamp > 0;
    const hasNewChanges = newLastUpdated > previousTimestamp;

    // Update the actual data
    completed = new Set(data.completed || []);
    completedFull = new Set(data.completedFull || []);
    events = data.events || {};
    wordUsage = data.wordUsage || {};
    customVocab = data.customVocab || [];
    vocabAudio = data.vocabAudio || {};
    tasks = data.tasks || {};

    renderCalendar();
    updateTodayView();
    updateProgress();

    if (hadPreviousData && hasNewChanges) {
      console.log("✅ Showing changes popup");
      showChangesPopup();
    } else {
      console.log("No popup this time");
    }

    // Save the new timestamp for next time
    localStorage.setItem('lastKnownLastUpdated', newLastUpdated);
  }).catch(err => {
    console.error('Load error:', err);
  });
}

// Load data when app starts
loadData();

  [{r:'Взаимодействие',e:'Interaction'},{r:'Сотрудничество',e:'Cooperation'},{r:'Соглашение',e:'Agreement'},{r:'Противоречие',e:'Contradiction'},{r:'Последствие',e:'Consequence'}],
];

function getVocabForDate(d) {
  const ph = getPhaseIdx(d);
  const phStart = PHASES[ph].start;
  const weekNum = Math.floor((d - phStart)/(7*86400000));
  // map phase+week to vocab index
  const phaseOffsets = [0,1,4,14,20,25];
  const offset = phaseOffsets[Math.min(ph,phaseOffsets.length-1)];
  const idx = offset + (weekNum % 4);
  return ALL_VOCAB[Math.min(idx, ALL_VOCAB.length-1)];
}

      {name:'Cyrillic Block C',desc:'Learn У Ф Х Ц Ч Ш Щ Ъ Ы Ь Э Ю Я. The tricky ones — write each slowly, say it 3 times.',dur:'20 min',secs:1200},

      {name:g.t,desc:g.d,dur:'20 min',secs:1200},

      {name:'Anki Review',desc:'Daily review + add new grammar rules as cards.',dur:'10 min',secs:600},
      {name:'Write 3 Sentences',desc:'Write 3 sentences using today\'s grammar. Show Jenny for a check.',dur:'10 min',secs:600},

    {name:'Teach Jenny Something',desc:'Explain something — anything — to Jenny entirely in Russian for 15 minutes.',dur:'15 min',secs:900},
  ];

    {name:'Advanced Anki',desc:'Add nuanced vocab — idioms, formal phrases, slang you\'ve picked up from Jenny.',dur:'15 min',secs:900},

}

function toDS(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function dsToDate(ds){const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d);}
function inRange(d){return d>=RANGE_START&&d<=RANGE_END;}

let AC=null;
function getAC(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC}
function tone(freq,type,dur,vol,delay=0){
  try{const ac=getAC();const o=ac.createOscillator();const g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.type=type;
    o.frequency.setValueAtTime(freq,ac.currentTime+delay);
    g.gain.setValueAtTime(0,ac.currentTime+delay);
    g.gain.linearRampToValueAtTime(vol,ac.currentTime+delay+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+delay+dur);
    o.start(ac.currentTime+delay);o.stop(ac.currentTime+delay+dur+0.05)}catch(e){}}
function soundTap(){tone(480,'sine',0.06,0.12)}
function soundCheck(){tone(523,'sine',0.12,0.18);setTimeout(()=>tone(784,'sine',0.18,0.14),80)}
function soundUncheck(){tone(392,'sine',0.08,0.1)}
function soundOpen(){tone(440,'sine',0.1,0.1);tone(550,'sine',0.12,0.08,0.06)}
function soundClose(){tone(350,'sine',0.1,0.08)}
function soundComplete(){[523,659,784,1047].forEach((f,i)=>tone(f,'sine',0.2,0.15,i*0.1))}
function soundTimerDone(){[523,659,784,659,784,1047].forEach((f,i)=>tone(f,'triangle',0.25,0.2,i*0.12))}
function soundTimerTick(){tone(660,'square',0.02,0.04)}
function soundWord(){tone(600,'sine',0.07,0.1);tone(900,'sine',0.09,0.08,0.05)}

// ═══════════════════════════════════════════════════════════
function checkAutoComplete(ds) {
  const d=dsToDate(ds);
  const {tasks}=getDayData(d);
  if(!tasks.length) return;
  const taskDone=new Set();
  const allDone=tasks.every((_,i)=>taskDone.has(String(i)));
  if(allDone){
    const wasntFull=!completedFull.has(ds);
    completedFull.add(ds);
    completed.add(ds);
    if(wasntFull) soundComplete();
    saveAll();
    renderCalendar();
  }
}

const MONTHS_AVAIL=[];
{let d=new Date(2026,4,1);while(d<=RANGE_END){MONTHS_AVAIL.push({y:d.getFullYear(),m:d.getMonth()});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}

function changeMonth(dir){
  soundTap();
  const idx=MONTHS_AVAIL.findIndex(x=>x.y===currentMonth.y&&x.m===currentMonth.m);
  const ni=Math.max(0,Math.min(MONTHS_AVAIL.length-1,idx+dir));
  currentMonth=MONTHS_AVAIL[ni];
  renderCalendar();
}

function renderCalendar(){
  const{y,m}=currentMonth;
  document.getElementById('cal-label').innerHTML=MN[m]+' <span>'+y+'</span>';
  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  const first=new Date(y,m,1);
  const startDow=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate();

  for(let i=0;i<42;i++){
    const day=i-startDow+1;
    const cell=document.createElement('div');
    cell.className='day-cell';
    if(day<1||day>dim){cell.classList.add('out-range');const n=day<1?new Date(y,m,day).getDate():day-dim;cell.innerHTML=`<span class="day-num" style="color:var(--t3)">${n}</span>`;grid.appendChild(cell);continue;}
    const d=new Date(y,m,day);
    const ds=toDS(d);
    const ir=inRange(d);
    const ph=ir?getPhaseIdx(d):-1;
    const isToday=ds===TODAY_DS;
    const isDoneFull=completedFull.has(ds);
    const isDonePartial=completed.has(ds)&&!completedFull.has(ds);
    const isExam=EXAMS.includes(ds);
    if(ir&&ph>=0)cell.classList.add('ph'+ph);
    else if(!ir)cell.classList.add('out-range');
    if(isToday)cell.classList.add('today');
    if(isExam)cell.classList.add('exam-day');
    if(ds===selectedDS)cell.classList.add('selected');

    let dotsHTML = '';

    // Phase dot
    if(ir&&ph>=0){
      dotsHTML += `<div class="day-dot" style="background:${PHASES[ph].color}88"></div>`;
    }

    // User Events colored dots
    const dayEvents = events[ds] || [];
    if(dayEvents.length > 0){
      dayEvents.forEach(ev => {
        const col = ev.color || '#a78bfa';
        dotsHTML += `<div class="day-dot" style="background:${col}; width:5px; height:5px;"></div>`;
      });
    }

    // Completion dot
    let completionDot = '';
    if(isDoneFull){
      completionDot = '<div class="cell-done-dot full"></div>';
    } else if(isDonePartial){
      completionDot = '<div class="cell-done-dot partial"></div>';
    }

    cell.innerHTML =
      `<span class="day-num">${day}</span>` +
      `<div class="day-dots">${dotsHTML}</div>`;

    // Add completion dot on top
    if(completionDot){
      const dotEl = document.createElement('div');
      dotEl.innerHTML = completionDot;
      cell.appendChild(dotEl.firstChild);
    }

    // Word usage dot
    const wu=wordUsage[ds]||{};
    const vocab=ir?getVocabForDate(d):null;
    if(vocab&&ir){
      const used=vocab.filter((_,i)=>(wu[i]||0)>0).length;
      if(used>0){
        const wordDot = document.createElement('div');
        wordDot.className = used === vocab.length ? 'cell-word-dot all' : 'cell-word-dot some';
        cell.appendChild(wordDot);
      }
    }

    if(ir){cell.addEventListener('click',()=>{soundTap();selectedDS=ds;renderCalendar();openSheet(ds)});}
    grid.appendChild(cell);
  }
}

function toggleTask(ds,idx){
  if (!tasks[ds]) tasks[ds] = {};
  tasks[ds][idx] = !tasks[ds][idx];

  const dayTasks = getDayData(dsToDate(ds)).tasks;
  const allDone = dayTasks.every((_,i) => tasks[ds][i]);

  if (allDone) {
    completedFull.add(ds);
    completed.add(ds);
    soundComplete();
  } else if (tasks[ds][idx]) {
    soundCheck();
  } else {
    soundUncheck();
  }

  saveAll();

  // Refresh the current sheet
  if (currentSheetDS === ds) {
    openSheet(ds);   // re-open to refresh UI
  }

  updateTodayView();
  renderCalendar();
}

function updateMarkBtn(ds){

  const isDoneFull=completedFull.has(ds);const isDonePartial=completed.has(ds)&&!completedFull.has(ds);
  btn.className='mark-btn'+(isDoneFull?' done-full':isDonePartial?' done-partial':'');
  btn.textContent=isDoneFull?'✓ Day Complete (all tasks)':isDonePartial?'◑ Day Complete (partial)':'Mark Day as Complete';
}

function toggleDone(ds){
  if(completed.has(ds)){completed.delete(ds);completedFull.delete(ds);soundUncheck();}
  else{completed.add(ds);soundComplete();}  // manual = partial unless all tasks done
  saveAll();renderCalendar();updateTodayView();updateProgress();updateMarkBtn(ds);
}

// WORD USAGE
// ═══════════════════════════════════════════════════════════
const lastTap={};
function handleWordTap(ds,idx){
  soundWord();
  const now=Date.now();
  const key=ds+'-'+idx;
  const isDoubleTap=(now-( lastTap[key]||0))<400;
  lastTap[key]=now;
  if(!wordUsage[ds])wordUsage[ds]={};
  if(isDoubleTap){
    // double tap = decrement
    wordUsage[ds][idx]=Math.max(0,(wordUsage[ds][idx]||0)-1);
  } else {
    wordUsage[ds][idx]=(wordUsage[ds][idx]||0)+1;
  }
  saveAll();
  // update card visually
  const card=document.getElementById('vc-'+ds+'-'+idx);
  if(card){
    const count=wordUsage[ds][idx]||0;
    const isUsed=count>0;
    card.classList.toggle('used',isUsed);
    // update count badge
    let badge=card.querySelector('.vocab-use-count');
    if(count>1){
      if(!badge){badge=document.createElement('div');badge.className='vocab-use-count';card.prepend(badge);}
      badge.textContent='x'+count;
    } else if(badge){badge.remove();}
  }
  renderCalendar();
}

function updateProgress(){
  let tot=0,done_c=0,remaining=0;
  let dt=new Date(RANGE_START);
  while(dt<=RANGE_END){tot++;if(completed.has(toDS(dt)))done_c++;dt.setDate(dt.getDate()+1);}
  remaining=tot-done_c;
  const pct=tot>0?Math.round((done_c/tot)*100):0;
  const circ=427.26;
  const ring=document.getElementById('prog-fill-ring');
  if(ring)ring.style.strokeDashoffset=circ-(circ*pct/100);
  const pt=document.getElementById('prog-pct-text');const dt2=document.getElementById('prog-days-text');
  if(pt)pt.textContent=pct+'%';if(dt2)dt2.textContent=done_c+' / '+tot+' days';
  const streak=calcStreak();
  const evtCount=Object.values(events).reduce((a,b)=>a+b.length,0);
  document.getElementById('prog-stats').innerHTML=`
    <div class="prog-stat" onclick="openSub('sub-complete')"><div class="prog-stat-arrow">›</div>

      <div class="prog-stat-val" style="color:var(--purple)">${evtCount}</div>
      <div class="prog-stat-label">Events Added</div></div>`;

  // Phase breakdown
  document.getElementById('phase-list').innerHTML=PHASES.map((p,pi)=>{
    let ptot=0,pdone=0;
    let dd=new Date(p.start);const pend=PHASES[pi+1]?PHASES[pi+1].start:PHASE_END;
    while(dd<pend&&dd<=RANGE_END){ptot++;if(completed.has(toDS(dd)))pdone++;dd.setDate(dd.getDate()+1);}

}

let vocabSearchTerm='';
let recordingKey=null;let mediaRecorder=null;let audioChunks=[];

function renderVocabBuilder(){
  const allWords=[];
  ALL_VOCAB.forEach((week,wi)=>week.forEach((w,i)=>allWords.push({...w,key:'w'+wi+'_'+i,custom:false})));
  customVocab.forEach((w,i)=>allWords.push({...w,key:'c'+i,custom:true,cIdx:i}));

  const filtered=vocabSearchTerm?allWords.filter(w=>
    w.r.toLowerCase().includes(vocabSearchTerm)||w.e.toLowerCase().includes(vocabSearchTerm.toLowerCase())):allWords;

  const el=document.getElementById('vocab-builder');
  if(!el)return;
  el.innerHTML=`
    <div class="add-vocab-form">
      <div class="add-vocab-title">Add Custom Word</div>
      <div class="add-vocab-row">
        <input class="add-vocab-input" id="cv-ru" placeholder="Русский…" style="font-size:15px">
        <input class="add-vocab-input" id="cv-en" placeholder="English…">
      </div>
      <button class="add-vocab-btn" onclick="addCustomVocab()" style="width:100%;justify-content:center;display:block;padding:10px">+ Add Word</button>
    </div>
    <input class="vocab-search" id="vocab-search" placeholder="🔍  Search words…" value="${vocabSearchTerm}" oninput="vocabSearch(this.value)">
    <div id="vocab-list">
      ${filtered.map(w=>{
        const hasAudio=!!vocabAudio[w.key];
        const isRec=recordingKey===w.key;
        return `<div class="vocab-list-item${w.custom?' custom':''}">
          <div style="flex:1">
            <div class="vocab-ru-big">${w.r}</div>
            <div class="vocab-en-small">${w.e}</div>
          </div>
          ${hasAudio?`<button class="vocab-audio-btn has-audio" onclick="playVocabAudio('${w.key}')" title="Play recording">▶</button>`:''}
          <button class="vocab-audio-btn${isRec?' recording':''}" onclick="toggleRecording('${w.key}')" title="${isRec?'Stop':'Record'}">
            ${isRec?'⏹':'🎙'}
          </button>
          ${w.custom?`<button class="vocab-del-btn" onclick="deleteCustomVocab(${w.cIdx})">✕</button>`:''}
        </div>`;
      }).join('')}
    </div>`;
}

function vocabSearch(v){vocabSearchTerm=v;renderVocabBuilder();}
function addCustomVocab(){
  const ru=document.getElementById('cv-ru')?.value?.trim();
  const en=document.getElementById('cv-en')?.value?.trim();
  if(!ru||!en)return;soundCheck();
  customVocab.push({r:ru,e:en});saveAll();renderVocabBuilder();
}
function deleteCustomVocab(idx){soundUncheck();customVocab.splice(idx,1);saveAll();renderVocabBuilder();}

async function toggleRecording(key){
  if(recordingKey===key){
    // stop
    if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
    recordingKey=null;return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recordingKey=key;audioChunks=[];
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
    mediaRecorder.onstop=()=>{
      const blob=new Blob(audioChunks,{type:'audio/webm'});
      const reader=new FileReader();
      reader.onload=()=>{vocabAudio[key]=reader.result;saveAll();recordingKey=null;stream.getTracks().forEach(t=>t.stop());renderVocabBuilder();};
      reader.readAsDataURL(blob);
    };
    mediaRecorder.start();
    renderVocabBuilder();
    // auto-stop after 10s
    setTimeout(()=>{if(mediaRecorder&&mediaRecorder.state!=='inactive'){mediaRecorder.stop();}},10000);
  }catch(e){alert('Microphone access needed for recording.');}
}
function playVocabAudio(key){
  const data=vocabAudio[key];if(!data)return;
  const audio=new Audio(data);audio.play().catch(()=>{});soundTap();
}

// STREAK CALC
// ═══════════════════════════════════════════════════════════
function calcStreak(){
  let s=0;let d=dsToDate(TODAY_DS);
  while(true){if(completed.has(toDS(d)))s++;else break;d.setDate(d.getDate()-1);if(d<RANGE_START)break;}
  return s;
}
function calcLongestStreak(){
  let longest=0,cur=0;let d=new Date(RANGE_START);
  while(d<=RANGE_END){if(completed.has(toDS(d))){cur++;longest=Math.max(longest,cur);}else cur=0;d.setDate(d.getDate()+1);}
  return longest;
}

  if(timerLeft<=0)return;timerRunning=!timerRunning;
  document.getElementById('timer-play-btn').textContent=timerRunning?'⏸':'▶';
  document.getElementById('timer-status').textContent=timerRunning?'FOCUS':'PAUSED';soundTap();
  if(timerRunning){timerInterval=setInterval(()=>{timerLeft--;
    if(timerLeft<=0){timerLeft=0;timerRunning=false;clearInterval(timerInterval);
      document.getElementById('timer-play-btn').textContent='✓';document.getElementById('timer-status').textContent='DONE';
      document.getElementById('timer-ring-wrap').classList.add('done-anim');
      setTimeout(()=>document.getElementById('timer-ring-wrap').classList.remove('done-anim'),700);
      soundTimerDone();if(navigator.vibrate)navigator.vibrate([200,100,200]);
    }else{if(timerLeft<=10)soundTimerTick();}updateTimerDisplay();},1000);
  }else clearInterval(timerInterval);
}
function resetTimer(){soundUncheck();clearInterval(timerInterval);timerRunning=false;timerLeft=timerTotal;
  document.getElementById('timer-play-btn').textContent='▶';document.getElementById('timer-status').textContent='READY';updateTimerDisplay();}
function addMinute(){soundTap();timerLeft+=60;if(timerLeft>timerTotal)timerTotal=timerLeft;updateTimerDisplay();}
function updateTimerDisplay(){
  const m=Math.floor(timerLeft/60),s=timerLeft%60;
  document.getElementById('timer-digits').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  const frac=timerTotal>0?timerLeft/timerTotal:0;
  const circ=615.75;const ring=document.getElementById('t-ring');
  ring.style.strokeDashoffset=circ*(1-frac);ring.className='t-ring-fill'+(timerLeft<=30&&timerLeft>0?' warning':'');
}

// ═══════════════════════════════════════════════════════════
// PWA INSTALL
// ═══════════════════════════════════════════════════════════
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('install-banner').style.display='flex';});
function triggerInstall(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById('install-banner').style.display='none';});}
document.getElementById('install-banner-btn').addEventListener('click',triggerInstall);

// ═══════════════════════════════════════════════════════════
// SERVICE WORKER
// ═══════════════════════════════════════════════════════════
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}

// ═══════════════════════════════════════════════════════════
// INIT — jump to today's month
// ═══════════════════════════════════════════════════════════
const todayDate=dsToDate(TODAY_DS);
currentMonth={y:todayDate.getFullYear(),m:todayDate.getMonth()};
renderCalendar();
updateTodayView();
updateProgress();

// ═══════════════════════════════════════════════════════════
// SWIPE TO CHANGE MONTH
// ═══════════════════════════════════════════════════════════
let touchStartX = 0;
let touchEndX = 0;

function handleSwipe(){
  const diff = touchStartX - touchEndX;
  if(Math.abs(diff) < 80) return; // ignore small swipes

  if(diff > 0){
    changeMonth(1);  // swipe left → next month
  } else {
    changeMonth(-1); // swipe right → previous month
  }
}

const calGrid = document.getElementById('cal-grid');
calGrid.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, false);

calGrid.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, false);

</script>
